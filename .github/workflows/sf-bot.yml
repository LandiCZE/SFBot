name: sf-bot

on:
  schedule:
    # GitHub drops scheduled ticks under load, and :00 / :30 are the two
    # busiest minutes. :07 and :37 are off the hot path and fire reliably.
    # (Still every 30 min; just offset.)
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      run_seconds:
        description: 'Seconds to run (default 1500 = 25 min)'
        required: false
        default: '1500'

# Never run two bot sessions in parallel — the second would knock the first
# out of the SSO session. Queue cron-triggered runs; let manual runs cancel.
concurrency:
  group: sf-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build (dev profile, cached)
        run: cargo build

      - name: Run bot
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_SERVER: ''
          SF_CHARACTER: ${{ secrets.SF_CHARACTER }}
          DRY_RUN: 'false'
          RUN_SECONDS: ${{ github.event.inputs.run_seconds || '1500' }}
          MAX_CYCLES: '2000'
          RUST_LOG: info
        run: cargo run --quiet

      - name: Upload decisions.jsonl
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decisions-${{ github.run_id }}
          path: decisions.jsonl
          if-no-files-found: ignore
          retention-days: 14
